name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run tests with SQLite
        run: |
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key
          ENVIRONMENT: testing

      - name: Run tests with PostgreSQL
        run: |
          pytest tests/ -v --tb=short -k "not test_" --ignore=tests/
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_platform
          SECRET_KEY: test-secret-key
          ENVIRONMENT: testing
        continue-on-error: true  # PostgreSQL tests are optional
